[package]
name = "rmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
crossterm = "0.29"
libghostty-vt = "0.2.1"
nix = { version = "0.31", features = ["term", "fs", "process", "signal", "user", "ioctl", "poll"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
